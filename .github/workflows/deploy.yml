name: Deploy

# Docs-only pushes skip the deploy: a full apply, sync and invalidation for a
# README edit is wasted. A push mixing Markdown with anything else still runs.
# workflow_dispatch remains the manual escape hatch.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

# id-token lets the job mint an OIDC token and trade it for AWS credentials.
# Nothing long-lived is stored in the repository.
permissions:
  contents: read
  id-token: write

# Two concurrent applies would fight over Terraform state.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: Build, apply, publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # See ci.yml — these two lines are load-bearing under setup-node v5+.
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: hashicorp/setup-terraform@v4
        with:
          # Must be >= the version used locally: Terraform refuses to read state
          # written by a newer version, so a lower pin here breaks deploys.
          terraform_version: 1.15.8

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ---- Infrastructure -------------------------------------------------
      # Runs before the upload so a brand-new bucket or a changed CloudFront
      # behavior exists by the time we sync.

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_contact_to_address: ${{ secrets.CONTACT_TO_ADDRESS }}
          TF_VAR_contact_from_address: ${{ secrets.CONTACT_FROM_ADDRESS }}
          # Must mirror whatever the domain was applied with locally. If these
          # are unset while the records exist in state, this apply deletes them.
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_guitarstore_subdomain: ${{ vars.GUITARSTORE_SUBDOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -auto-approve -input=false

      - name: Read Terraform outputs
        id: tf
        working-directory: infra
        run: |
          echo "bucket=$(terraform output -raw site_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"

      # ---- Site -----------------------------------------------------------

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      # Three passes, because the right cache header differs by file type.
      # Fingerprinted assets are immutable; HTML must be revalidated or users
      # keep getting the old page after a deploy; the icons are neither.
      #
      # `--delete` honours the excludes, so a file skipped by one pass is not
      # deleted by it either — the passes do not fight over the bucket.
      - name: Upload fingerprinted assets
        run: |
          aws s3 sync web/dist/portfolio/browser "s3://${{ steps.tf.outputs.bucket }}" \
            --delete \
            --exclude "*.html" \
            --exclude "favicon.*" \
            --exclude "apple-touch-icon.png" \
            --cache-control "public, max-age=31536000, immutable"

      # Icons live at fixed names, so an immutable year-long cache means a
      # changed favicon never reaches anyone who already loaded the old one —
      # browser caches survive a CloudFront invalidation. They are small and
      # requested once per session, so revalidating hourly costs nothing.
      - name: Upload icons
        run: |
          aws s3 sync web/dist/portfolio/browser "s3://${{ steps.tf.outputs.bucket }}" \
            --delete \
            --exclude "*" \
            --include "favicon.*" \
            --include "apple-touch-icon.png" \
            --cache-control "public, max-age=3600, must-revalidate"

      - name: Upload HTML
        run: |
          aws s3 sync web/dist/portfolio/browser "s3://${{ steps.tf.outputs.bucket }}" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        # Only the HTML needs purging — assets are fingerprinted, so a new build
        # produces new filenames. /* is simpler and the first 1000 paths per
        # month are free.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Summary
        run: echo "Deployed to ${{ steps.tf.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
