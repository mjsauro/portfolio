name: CI

# Verification only — no AWS credentials are requested, so a pull request from a
# fork can never touch infrastructure.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  web:
    name: Build and test the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # Both cache lines are required, not decorative. setup-node >= v5
          # turns caching on by itself when package.json has a packageManager
          # field (ours does) and then looks for a lockfile at the repository
          # root — where there isn't one, because the app lives in web/.
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "src/**/*.html" "src/**/*.css"

      - name: Check formatting of the CloudFront function
        # Runs here because this is the only job with Prettier installed.
        # --config is required, not tidiness: Prettier resolves configuration
        # per file, and infra/ sits outside web/, so without it these files are
        # checked against Prettier's defaults and always fail.
        run: npx prettier --config .prettierrc --check "../infra/functions/*.js"

      - run: npm test -- --watch=false

      - name: Build
        run: npm run build

      - name: Verify prerendering produced real HTML
        # Catches a regression where routes silently fall back to a client-side
        # shell — the whole SEO rationale for SSG would be gone.
        run: |
          for route in index about/index projects/index; do
            file="dist/portfolio/browser/${route}.html"
            if [ ! -f "$file" ]; then
              echo "::error::Missing prerendered file: $file"
              exit 1
            fi
            if ! grep -q '<h1' "$file"; then
              echo "::error::$file has no <h1> — it was not prerendered"
              exit 1
            fi
          done
          echo "Prerendered routes look good."

  functions:
    name: Test the CloudFront function
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # No cache: line here, and no npm ci step. The tests use node:test and
          # node:vm only, so infra/ needs neither a package.json nor a lockfile
          # — enabling the cache would just fail looking for one.
          node-version: 20

      # terraform validate parses the .tf files but treats the function body as
      # an opaque string, so this is the only thing standing between a typo in
      # rewrite-index.js and a 503 on every request to the site.
      - name: Test
        run: node --test infra/functions/

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          # Must be >= the version used locally: Terraform refuses to read state
          # written by a newer version, so a lower pin here breaks deploys.
          terraform_version: 1.15.8

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate infra
        # No backend needed just to typecheck the configuration.
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Validate bootstrap
        run: |
          terraform -chdir=bootstrap init -backend=false
          terraform -chdir=bootstrap validate
